*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#e6e6e9;font-family:'Figtree','Segoe UI',Roboto,Arial,sans-serif;color:#1c1c1f}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:radial-gradient(700px 500px at 12% 8%,#f4f4f6,transparent),radial-gradient(800px 520px at 95% 95%,#d9d9de,transparent),#e9e9ec}
#stage>*,#dyn>*{position:absolute}
.bx>*{position:absolute}
svg{display:block;overflow:visible}
svg text{font-family:'Figtree','Segoe UI',Arial,sans-serif}
a{text-decoration:none;color:inherit}
.rw{cursor:pointer}
.cd{background:#fff;border-radius:20px;box-shadow:0 10px 26px rgba(30,30,40,.07)}
.lang{width:36px;height:30px;line-height:28px;text-align:center;border:1px solid #e1e1e6;background:#fff;color:#55555c;font-size:12px;font-weight:700;cursor:pointer;border-radius:15px}
.lang:hover{background:#fff1ea}.lang.on{background:#ef5d1f;color:#fff;border-color:#ef5d1f}
.sp{display:flex;align-items:center;justify-content:center;height:26px;border-radius:13px;font-size:11.5px;font-weight:700;border:1px solid;white-space:nowrap}
.sp.em{background:#f4f4f6;border-color:#dcdce2;color:#333}.sp.yt{background:#fde8e6;border-color:#f7b9b3;color:#c4261b}.sp.li{background:#e3effa;border-color:#a9cdee;color:#0a5aa8}.sp.pf{background:#fff0e8;border-color:#f6bf9f;color:#c4470f}.sp.wa{background:#e2f6e9;border-color:#a2dcb8;color:#16803f}
.sp:hover{filter:brightness(.96)}
.ib{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#f1f1f4;cursor:pointer;color:#333}
.ib:hover{background:#ffe3d6}
.dy{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:20px;cursor:pointer;background:#fff;box-shadow:0 8px 20px rgba(30,30,40,.06)}
.dy.on{background:#ef5d1f;color:#fff;box-shadow:0 12px 24px rgba(239,93,31,.35)}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#1c1c1f;color:#fff;font:600 12.5px 'Figtree','Segoe UI',Arial;padding:5px 10px;white-space:nowrap;border-radius:8px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(20,20,26,.55);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(1000px,96vw);height:min(480px,88vh);background:#fff;border:1px solid #ef5d1f;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff5f0;border-bottom:1px solid #f3d9cc}
#sheet .tp b{flex:1;font-size:16px;color:#c4470f}
#sheet button{height:30px;padding:0 14px;border:1px solid #ef5d1f;border-radius:8px;background:#fff;color:#c4470f;font-weight:700;cursor:pointer;font-family:inherit}
#sheet button:hover{background:#ef5d1f;color:#fff}
#sheet .scr{flex:1;overflow:auto}
